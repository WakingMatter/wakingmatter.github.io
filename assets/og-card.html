<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Waking Matter — Open Graph</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body::before {
        opacity: 0.03;
      }

      .og {
        display: grid;
        grid-template-columns: 1fr 140px;
        gap: 64px;
        width: 1200px;
        height: 630px;
        padding: 56px 64px 52px;
      }

      .og .wordmark {
        font-size: 118px;
        animation: none;
        opacity: 1;
        transform: none;
      }

      .og .wordmark span,
      .og .lede,
      .og .aside,
      .og .band {
        animation: none !important;
        opacity: 1;
        transform: none;
      }

      .og .band {
        opacity: var(--o);
      }

      .og .lede {
        margin-top: 28px;
        font-size: 28px;
        max-width: 14em;
      }

      .og .aside {
        margin-top: 22px;
        font-size: 20px;
      }

      .og .specimen,
      .og .core-shell,
      .og .core {
        height: 100%;
        min-height: 0;
        width: 108px;
      }

      .og .mast-mark {
        margin: 0 0 36px;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div>
        <p class="mast-mark">Waking Matter</p>
        <h1 class="wordmark">
          <span>Waking</span>
          <span>Matter</span>
        </h1>
        <p class="lede">Building systems for cumulative intelligence.</p>
        <p class="aside">Intelligence should accumulate.</p>
      </div>
      <div class="specimen" aria-hidden="true">
        <div class="core-shell">
          <svg class="core" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 640" preserveAspectRatio="none">
            <rect class="core-ground" x="0" y="0" width="72" height="640" fill="currentColor" />
            <rect class="band" x="0" y="0" width="72" height="12" fill="var(--ink)" style="--o:0.064" />
            <rect class="band" x="0" y="12" width="72" height="28" fill="var(--ink)" style="--o:0.061" />
            <rect class="band" x="0" y="40" width="72" height="14" fill="var(--ink)" style="--o:0.071" />

            <rect class="band" x="0" y="88" width="72" height="8" fill="var(--ink)" style="--o:0.09" />
            <rect class="band" x="0" y="96" width="72" height="16" fill="var(--ink)" style="--o:0.054" />
            <rect class="band" x="0" y="112" width="72" height="34" fill="var(--ink)" style="--o:0.101" />
            <rect class="band" x="0" y="146" width="72" height="16" fill="var(--ink)" style="--o:0.089" />
            <rect class="band" x="0" y="162" width="72" height="10" fill="var(--ink)" style="--o:0.063" />
            <rect class="band" x="0" y="172" width="72" height="14" fill="var(--ink)" style="--o:0.067" />
            <rect class="band" x="0" y="186" width="72" height="10" fill="var(--ink)" style="--o:0.078" />
            <rect class="band" x="0" y="196" width="72" height="6" fill="var(--ink)" style="--o:0.09" />
            <rect class="band" x="0" y="202" width="72" height="12" fill="var(--ink)" style="--o:0.109" />

          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
